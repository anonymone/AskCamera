name: AskCamera
options:
  bundleIdPrefix: com.severuspeng
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  AskCamera:
    type: application
    platform: iOS
    sources:
      - AskCamera
      # Core ML 模型（gitignore 排除，构建前先跑 scripts/download_models.sh）
      - path: Models/yoloworld_detector.mlpackage
        optional: true
      - path: Models/clip_text_encoder.mlpackage
        optional: true
      - path: Models/clip_vocab.json
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.severuspeng.AskCamera
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "AskCamera 需要使用相机以提供实时取景、对焦、拍照与录像。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AskCamera 需要使用麦克风进行语音控制，并在录像时录制声音；全部处理均在设备端完成。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "AskCamera 需要将拍摄的照片与视频保存到相册。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        COREML_CODEGEN_LANGUAGE: None
  AskCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AskCameraTests
    dependencies:
      - target: AskCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.severuspeng.AskCameraTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

schemes:
  AskCamera:
    build:
      targets:
        AskCamera: all
        AskCameraTests: [test]
    test:
      targets:
        - AskCameraTests
